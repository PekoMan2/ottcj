name: ${COMPOSE_PROJECT_NAME:-run-tracker}

services:
  fe:
    build:
      context: ./fe
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
