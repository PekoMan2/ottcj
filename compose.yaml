name: ${COMPOSE_PROJECT_NAME}

services:
  db:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    command: ["postgres", "-p", "${DB_PORT}"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXPOSED_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U '${DB_USER}' -d '${DB_NAME}' -p '${DB_PORT}'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  be:
    build:
      context: ./be
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE}
      TRACKING_SECRET: ${TRACKING_SECRET}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "${PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  fe:
    build:
      context: ./fe
    restart: unless-stopped
    depends_on:
      be:
        condition: service_healthy
    ports:
      - "${APP_PORT}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
