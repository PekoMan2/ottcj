name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: fe

      - name: Verify
        working-directory: fe
        run: |
          npm run typecheck
          npm run lint
          npm run test -- --run

      - name: Build
        run: npm run build
        working-directory: fe

      # The zip contains only the contents of fe/dist: the deployable site.
      - name: Package
        working-directory: fe/dist
        run: zip -r "$GITHUB_WORKSPACE/ottcj-site.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ github.run_number }}"
          gh release create "$tag" ottcj-site.zip \
            --title "Site build $tag ($(date -u +%Y-%m-%d))" \
            --notes "Built from ${GITHUB_SHA:0:7}" \
            --target "$GITHUB_SHA"
